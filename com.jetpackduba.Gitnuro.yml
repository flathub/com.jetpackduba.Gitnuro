app-id: com.jetpackduba.Gitnuro
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: gitnuro
finish-args:
  - --socket=x11
  - --share=ipc
  - --share=network
  - --filesystem=host
  - --filesystem=xdg-run/gnupg
  - --device=dri
  - --socket=gpg-agent
  - --talk-name=org.freedesktop.Flatpak
  - --socket=ssh-auth
modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk17/install.sh
  - name: gitnuro
    buildsystem: simple
    build-commands:
      - install -D gitnuro /app/bin/gitnuro
      - install -D Gitnuro.jar /app/share/Gitnuro.jar
      - install -D com.jetpackduba.Gitnuro.desktop /app/share/applications/com.jetpackduba.Gitnuro.desktop
      - install -D icon.png /app/share/icons/hicolor/512x512/apps/com.jetpackduba.Gitnuro.png
      - install -D com.jetpackduba.Gitnuro.metainfo.xml /app/share/appdata/com.jetpackduba.Gitnuro.metainfo.xml
    sources:
      - type: file
        path: gitnuro
      - type: file
        url: https://github.com/JetpackDuba/Gitnuro/releases/download/v1.4.3/Gitnuro-linux-x86_64-1.4.3.jar
        sha256: b8ac49cb59b764125213b4059f8a5830d6c97df27d8a26c88ca79bddc59eff28
        only-arches: [x86_64]
        dest-filename: Gitnuro.jar
      - type: file
        url: https://github.com/JetpackDuba/Gitnuro/releases/download/v1.4.3/Gitnuro-linux-arm_aarch64-1.4.3.jar
        sha256: 297ced86fe034cc58eaf9ec62233384f33377697af0ce9f1b267fb33b140ef6f
        only-arches: [aarch64]
        dest-filename: Gitnuro.jar
      - type: file
        path: com.jetpackduba.Gitnuro.desktop
      - type: file
        path: icon.png
      - type: file
        path: com.jetpackduba.Gitnuro.metainfo.xml
