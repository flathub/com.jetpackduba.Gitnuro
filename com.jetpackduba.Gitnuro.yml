app-id: com.jetpackduba.Gitnuro
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk25
command: gitnuro
finish-args:
  - --socket=x11
  - --share=ipc
  - --share=network
  - --filesystem=host
  - --filesystem=xdg-run/gnupg
  - --device=dri
  - --socket=gpg-agent
  - --talk-name=org.freedesktop.Flatpak
  - --socket=ssh-auth
modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk25/install.sh
  - name: gitnuro
    buildsystem: simple
    build-commands:
      - install -D gitnuro /app/bin/gitnuro
      - install -D Gitnuro.jar /app/share/Gitnuro.jar
      - install -D com.jetpackduba.Gitnuro.desktop /app/share/applications/com.jetpackduba.Gitnuro.desktop
      - install -D icon.png /app/share/icons/hicolor/512x512/apps/com.jetpackduba.Gitnuro.png
      - install -D com.jetpackduba.Gitnuro.metainfo.xml /app/share/appdata/com.jetpackduba.Gitnuro.metainfo.xml
    sources:
      - type: file
        path: gitnuro
      - type: file
        url: https://github.com/JetpackDuba/Gitnuro/releases/download/2.0.0/Gitnuro-linux-x86_64-2.0-2.0.0.jar
        sha256: ec06881c94fefb15bd6120e83549b1e18b0e4bbbaac53010b38409b4b7ee6ef8
        only-arches: [x86_64]
        dest-filename: Gitnuro.jar
      - type: file
        url: https://github.com/JetpackDuba/Gitnuro/releases/download/2.0.0/Gitnuro-linux-arm_aarch64-2.0-2.0.0.jar
        sha256: 0414e45dc1c60474510c5cab54ff321fee6f84140253d924bf48dbde2d7dcd21
        only-arches: [aarch64]
        dest-filename: Gitnuro.jar
      - type: file
        path: com.jetpackduba.Gitnuro.desktop
      - type: file
        path: icon.png
      - type: file
        path: com.jetpackduba.Gitnuro.metainfo.xml
