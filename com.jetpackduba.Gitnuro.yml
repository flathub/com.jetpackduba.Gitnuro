app-id: com.jetpackduba.Gitnuro
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: gitnuro
finish-args:
  - --socket=x11
  - --share=ipc
  - --share=network
  - --filesystem=host
  - --filesystem=xdg-run/gnupg
  - --device=dri
  - --socket=gpg-agent
  - --talk-name=org.freedesktop.Flatpak
  - --socket=ssh-auth
modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh
  - name: gitnuro
    buildsystem: simple
    build-commands:
      - install -D gitnuro /app/bin/gitnuro
      - install -D Gitnuro.jar /app/share/Gitnuro.jar
      - install -D com.jetpackduba.Gitnuro.desktop /app/share/applications/com.jetpackduba.Gitnuro.desktop
      - install -D icon.png /app/share/icons/hicolor/512x512/apps/com.jetpackduba.Gitnuro.png
      - install -D com.jetpackduba.Gitnuro.metainfo.xml /app/share/appdata/com.jetpackduba.Gitnuro.metainfo.xml
    sources:
      - type: file
        path: gitnuro
      - type: file
        url: https://github.com/JetpackDuba/Gitnuro/releases/download/v1.5.0/Gitnuro-linux-x86_64-1.5.0.jar
        sha256: 128063c3df0ee603b6c133b7e0a32215eb5eaf261aa590bcdcc51f22ac6d6e64
        only-arches: [x86_64]
        dest-filename: Gitnuro.jar
      - type: file
        url: https://github.com/JetpackDuba/Gitnuro/releases/download/v1.5.0/Gitnuro-linux-arm_aarch64-1.5.0.jar
        sha256: a009826a9bbdc454b52cc6ac8f6d6adfd43fe328cb87a319c7bf6d0bc62395e7
        only-arches: [aarch64]
        dest-filename: Gitnuro.jar
      - type: file
        path: com.jetpackduba.Gitnuro.desktop
      - type: file
        path: icon.png
      - type: file
        path: com.jetpackduba.Gitnuro.metainfo.xml
